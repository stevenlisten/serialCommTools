<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serial Listener · 串口侦听器</title>
<style>
/* ============ 设计系统（暗色主题） ============ */
:root{
  --bg0:#070b13; --bg1:#0b101c; --bg2:#0e1524;
  --panel:#111a2c; --panel2:#0c1322; --panel3:#182338;
  --line:#1c2a45; --line2:#26375a;
  --text:#e8eef7; --text2:#9fb0c9; --text3:#5f7190;
  --accent:#38bdf8; --accent2:#6366f1; --accent-soft:rgba(56,189,248,.12);
  --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,"Courier New",monospace;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(56,189,248,.08), transparent 60%),
    radial-gradient(900px 400px at -10% 110%, rgba(99,102,241,.08), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg0));
  color:var(--text);
  display:flex;flex-direction:column;
  min-width:980px;min-height:640px;
  overflow:hidden;
}
::selection{background:rgba(56,189,248,.35)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#24334f;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#32456b;background-clip:content-box;border:2px solid transparent}

#app{display:flex;flex-direction:column;height:100vh;padding:14px 16px 10px;gap:10px}

/* ============ 顶栏 ============ */
.topbar{
  display:flex;align-items:center;gap:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--panel);
  border:1px solid var(--line);border-radius:var(--r);
  padding:12px 16px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo{
  width:42px;height:42px;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(56,189,248,.35);
}
.logo svg{width:24px;height:24px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand p{font-size:11px;color:var(--text3);margin-top:2px}
.conn{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10.5px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.field select,.field .portsel select{
  background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:8px;height:32px;padding:0 8px;font-size:12.5px;outline:none;
  transition:border-color .15s, box-shadow .15s;
  min-width:86px;
}
.field select:hover{border-color:var(--line2)}
.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.portsel{display:flex;gap:6px}
.portsel select{min-width:150px}

/* 按钮 */
.btn{
  border:1px solid var(--line2);background:var(--panel3);color:var(--text);
  border-radius:8px;height:32px;padding:0 14px;font-size:12.5px;font-weight:600;
  transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:#fff;background:#1b2942}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;color:#04121f;min-width:108px;justify-content:center;
  box-shadow:0 4px 14px rgba(56,189,248,.25);
}
.btn.primary:hover{filter:brightness(1.1);color:#04121f}
.btn.primary.connected{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,.3);color:#022c22}
.btn.primary.danger{background:linear-gradient(135deg,#f87171,#dc2626);box-shadow:0 4px 14px rgba(248,113,113,.3);color:#2a0606}
.btn.sm{height:26px;padding:0 10px;font-size:11.5px;border-radius:7px}
.btn.ghost{background:transparent}
.btn.accent{background:var(--accent-soft);border-color:rgba(56,189,248,.35);color:var(--accent)}
.btn.accent:hover{background:rgba(56,189,248,.2)}

/* ============ 工具栏 ============ */
.toolbar{
  display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;row-gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 12px;flex-shrink:0;
}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{
  border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:600;
  padding:5px 16px;border-radius:7px;transition:all .15s;
}
.seg button:hover{color:var(--text)}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04121f}
.sep{width:1px;height:22px;background:var(--line)}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);cursor:pointer;user-select:none;white-space:nowrap}
.chk input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.search{display:flex;align-items:center;gap:6px;flex:1 1 300px;min-width:300px;max-width:380px}
.search input{
  flex:1;min-width:130px;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;height:28px;padding:0 10px;font-size:12.5px;outline:none;transition:all .15s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input.active{border-color:var(--warn)}
.alarm{display:flex;align-items:center;gap:8px}
.alarm input[type=text]{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;height:28px;padding:0 10px;font-size:12px;outline:none;width:190px;
}
.alarm input[type=text]:focus{border-color:var(--warn);box-shadow:0 0 0 3px rgba(251,191,36,.15)}
.spacer{flex:1}
/* 开关 */
.switch{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .slider{
  width:32px;height:18px;border-radius:10px;background:var(--panel3);border:1px solid var(--line2);
  position:relative;transition:all .2s;flex-shrink:0;
}
.switch .slider::after{
  content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:#8ba3c7;transition:all .2s;
}
.switch input:checked + .slider{background:linear-gradient(135deg,#f59e0b,#ef4444);border-color:transparent}
.switch input:checked + .slider::after{left:16px;background:#fff}
.sw-label{font-size:12.5px;color:var(--text2)}

/* ============ 接收区 ============ */
.viewer-wrap{position:relative;flex:1;min-height:200px;display:flex;flex-direction:column;overflow:hidden;
  background:#04070d;border:1px solid var(--line);border-radius:var(--r);}
.viewer{flex:1;overflow-y:auto;padding:10px 14px;font-family:var(--mono);font-size:13px;line-height:1.62;}
.viewer .line{white-space:pre-wrap;word-break:break-all;color:#d7e2f2;padding:0 2px;border-radius:4px;}
.viewer .line:hover{background:rgba(148,163,184,.05)}
.viewer .line .ts{color:#475a7d;margin-right:8px;user-select:none;font-size:12px}
body.ts-off .viewer .line .ts{display:none}
.viewer .line .hex{color:#7dd3fc}
.viewer .line .asc{color:#8b9bb8;margin-left:10px}
.viewer .line mark{background:rgba(251,191,36,.35);color:#fde68a;border-radius:3px;padding:0 1px}
.viewer .line.pending{color:#5f7190;font-style:italic}
.viewer .line.sys{color:var(--text3);font-style:italic}
.viewer .line.sys b{color:var(--warn)}
.viewer .line.sys.err b{color:var(--danger)}
.viewer .line.txline{color:#bae6fd;background:rgba(56,189,248,.07);border-left:3px solid rgba(56,189,248,.55);padding-left:6px;border-radius:0 4px 4px 0}
.viewer .line.txline .dir{color:#38bdf8;font-weight:700;margin-right:4px;user-select:none}
.st-autolog{font-size:11px;color:var(--text3);font-family:var(--mono);white-space:nowrap}
.st-autolog.on{color:var(--ok)}
.st-autolog.dl{color:var(--warn)}
.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--text3);font-family:"Segoe UI","Microsoft YaHei",sans-serif;
}
.empty .empty-icon{width:64px;height:64px;border-radius:18px;background:var(--panel3);display:flex;align-items:center;justify-content:center;margin-bottom:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 24px rgba(0,0,0,.4)}
.empty .empty-icon svg{width:30px;height:30px;opacity:.7}
.empty h3{font-size:15px;color:var(--text2);font-weight:600}
.empty p{font-size:12.5px}
.banner{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:#fde68a;
  padding:7px 16px;border-radius:999px;font-size:12.5px;font-weight:600;backdrop-filter:blur(6px);
  box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:pointer;white-space:nowrap;
}
.hidden{display:none!important}

/* 报警闪烁 */
body.alarm .viewer-wrap{animation:alarmPulse 1s ease-in-out 3}
@keyframes alarmPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0)}
  50%{box-shadow:0 0 0 5px rgba(248,113,113,.55), inset 0 0 40px rgba(248,113,113,.12)}
}

/* ============ 发送区 ============ */
.sender{
  flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;display:flex;flex-direction:column;gap:8px;
}
.send-head{display:flex;align-items:center;gap:8px}
.send-title{font-size:12px;font-weight:700;color:var(--text2);margin-right:2px;letter-spacing:1px}
.send-head select{
  background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;
  height:26px;font-size:12px;padding:0 6px;outline:none;
}
.quicklist{display:flex;gap:6px;flex-wrap:wrap;flex:1;overflow:hidden;max-height:30px}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--panel3);border:1px solid var(--line);
  color:var(--text2);border-radius:999px;padding:2px 6px 2px 10px;font-size:11.5px;cursor:pointer;
  transition:all .15s;font-family:var(--mono);max-width:200px;
}
.chip:hover{border-color:var(--accent);color:#fff}
.chip .x{color:var(--text3);font-size:12px;padding:0 3px;border-radius:50%}
.chip .x:hover{color:var(--danger)}
.send-row{display:flex;gap:8px}
.send-row input{
  flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;height:36px;padding:0 12px;font-size:13px;font-family:var(--mono);outline:none;transition:all .15s;
}
.send-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.send-row .btn{height:36px}

/* ============ 状态栏 ============ */
.statusbar{
  flex-shrink:0;display:flex;align-items:center;gap:16px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:6px 14px;font-size:12px;color:var(--text2);
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--text3);flex-shrink:0}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:dotPulse 2s infinite}
.dot.err{background:var(--danger)}
@keyframes dotPulse{
  0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}
  70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}
  100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}
}
.st-item b{color:var(--text);font-family:var(--mono);font-weight:600}
.st-item.muted{color:var(--text3)}
#st-text{font-weight:600}
#st-text.on{color:var(--ok)}
#st-text.err{color:var(--danger)}

/* ============ Toast ============ */
#toasts{position:fixed;top:16px;right:16px;z-index:999;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{
  background:var(--panel3);border:1px solid var(--line2);color:var(--text);
  padding:10px 14px;border-radius:10px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:toastIn .25s ease;display:flex;gap:8px;align-items:flex-start;backdrop-filter:blur(8px);
}
.toast.info{border-left:3px solid var(--accent)}
.toast.ok{border-left:3px solid var(--ok)}
.toast.warn{border-left:3px solid var(--warn)}
.toast.err{border-left:3px solid var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* 不支持提示条 */
.unsupported{
  position:fixed;top:0;left:0;right:0;z-index:1000;background:#7f1d1d;color:#fecaca;
  text-align:center;padding:8px;font-size:13px;font-weight:600;
}
</style>
</head><body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04121f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3v3M15 3v3M7 6h10l1 3v4a4 4 0 0 1-8 0V9l-1-3z"/>
          <circle cx="12" cy="13" r="1.6" fill="#04121f"/>
          <path d="M12 17v4"/>
        </svg>
      </div>
      <div>
        <h1>Serial Listener</h1>
        <p>串口侦听器 · 单文件本地运行（Web Serial）</p>
      </div>
    </div>
    <div class="conn">
      <div class="field">
        <label>端口</label>
        <div class="portsel">
          <select id="sel-port"><option value="">未授权端口，请点击选择…</option></select>
          <button id="btn-pick" class="btn ghost sm" title="打开系统端口选择器" aria-label="打开系统端口选择器">选择…</button>
        </div>
      </div>
      <div class="field">
        <label>波特率</label>
        <select id="sel-baud"></select>
      </div>
      <div class="field">
        <label>数据位</label>
        <select id="sel-data">
          <option value="8">8</option>
          <option value="7">7</option>
        </select>
      </div>
      <div class="field">
        <label>停止位</label>
        <select id="sel-stop">
          <option value="1">1</option>
          <option value="2">2</option>
        </select>
      </div>
      <div class="field">
        <label>校验</label>
        <select id="sel-parity">
          <option value="none">无</option>
          <option value="even">偶校验</option>
          <option value="odd">奇校验</option>
        </select>
      </div>
      <div class="field">
        <label>流控</label>
        <select id="sel-flow">
          <option value="none">无</option>
          <option value="hardware">硬件 RTS/CTS</option>
        </select>
      </div>
      <div class="field">
        <label>编码</label>
        <select id="sel-enc">
          <option value="utf-8">UTF-8</option>
          <option value="gbk">GBK</option>
          <option value="latin1">Latin-1</option>
        </select>
      </div>
      <button id="btn-connect" class="btn primary" aria-label="连接或断开串口">连接</button>
    </div>
  </header>

  <section class="toolbar">
    <div class="seg" id="seg-mode">
      <button data-mode="ascii" class="on">文本</button>
      <button data-mode="hex">HEX</button>
    </div>
    <div class="sep"></div>
    <label class="chk"><input type="checkbox" id="chk-ts"><span>时间戳</span></label>
    <label class="chk"><input type="checkbox" id="chk-scroll"><span>自动滚动</span></label>
    <label class="chk"><input type="checkbox" id="chk-pause"><span>暂停</span></label>
    <button id="btn-clear" class="btn ghost sm" title="清空显示与日志">清空</button>
    <div class="sep"></div>
    <div class="search">
      <input id="in-filter" placeholder="过滤 / 搜索关键字…" spellcheck="false">
      <button id="btn-case" class="btn ghost sm" title="切换大小写敏感">Aa</button>
      <button id="btn-filteronly" class="btn ghost sm" title="仅显示匹配行">仅匹配</button>
    </div>
    <div class="sep"></div>
    <div class="alarm">
      <label class="switch">
        <input type="checkbox" id="chk-alarm">
        <span class="slider"></span>
        <span class="sw-label">报警</span>
      </label>
      <input type="text" id="in-alarm" placeholder="报警关键字,逗号分隔" spellcheck="false">
    </div>
    <div class="sep"></div>
    <label class="chk" title="连接成功后自动保存日志到本地"><input type="checkbox" id="chk-autolog"><span>自动保存日志</span></label>
    <button id="btn-logdir" class="btn ghost sm" title="选择自动保存目录（不选择则保存到浏览器下载目录，每段文件自动命名）">保存位置</button>
    <span id="st-autolog" class="st-autolog" title="自动日志状态"></span>
    <div class="spacer"></div>
    <button id="btn-export" class="btn accent sm" title="导出当前会话日志（.log，含时间戳）" aria-label="导出当前会话日志">导出日志</button>
  </section>

  <section class="viewer-wrap" id="viewer-wrap">
    <div id="viewer" class="viewer" role="log" aria-label="串口数据接收区" aria-live="off">
      <div class="empty" id="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12h4l2-7 4 14 2-7h8"/>
          </svg>
        </div>
        <h3>等待串口数据</h3>
        <p>点击右上角「连接」选择串口，即可开始实时侦听</p>
      </div>
    </div>
    <div id="pause-banner" class="banner hidden">已暂停</div>
  </section>

  <section class="sender">
    <div class="send-head">
      <span class="send-title">发送</span>
      <select id="sel-sendmode" title="发送格式">
        <option value="ascii">文本</option>
        <option value="hex">HEX</option>
      </select>
      <select id="sel-crlf" title="行尾附加">
        <option value="none">无换行</option>
        <option value="CR">CR</option>
        <option value="LF">LF</option>
        <option value="CRLF">CRLF</option>
      </select>
      <button id="btn-quickadd" class="btn ghost sm" title="将输入框内容存为快捷发送">+ 存为快捷</button>
      <div class="quicklist" id="quicklist"></div>
    </div>
    <div class="send-row">
      <input id="in-send" placeholder="输入要发送的内容，Enter 发送；HEX 模式示例：48 65 6C 6C 6F" spellcheck="false" autocomplete="off" aria-label="发送内容输入框">
      <button id="btn-send" class="btn primary">发送</button>
    </div>
  </section>

  <footer class="statusbar">
    <span class="dot" id="st-dot"></span>
    <span id="st-text">未连接</span>
    <span class="st-item">RX <b id="st-rx">0 B</b></span>
    <span class="st-item">速率 <b id="st-rate">0 B/s</b></span>
    <span class="st-item">TX <b id="st-tx">0 B</b></span>
    <span class="st-item" id="st-params"></span>
    <span class="spacer"></span>
    <span class="st-item" id="st-clock">--:--:--</span>
    <span class="st-item muted">v0.6.0 · 数据仅存于本机</span>
  </footer>
</div>
<div id="toasts"></div>
<script>'use strict';
/* =====================================================================
 * Serial Listener · 串口侦听器
 * 单文件纯前端实现（Web Serial API，Chrome/Edge，file:// 可直接运行）
 * 模块：Store(配置) / Serial(串口核心) / View(渲染) / Alarm(报警) / UI(交互)
 * ===================================================================== */

/* ---------------- 测试模式（?test=1 供 Playwright 自动化自测） ---------------- */
const TEST_MODE = new URLSearchParams(location.search).has('test');

/* ---------------- 工具函数 ---------------- */
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const pad = (n, w = 2) => String(n).padStart(w, '0');
function fmtTime(d = new Date()) {
  return '[' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + '.' + pad(d.getMilliseconds(), 3) + ']';
}
function fmtFileTime(d = new Date()) {
  return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}

function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    [[880, .18], [660, .18], [880, .22]].forEach(([f, d], i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + i * .2);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + i * .2 + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * .2 + d);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + i * .2); o.stop(t0 + i * .2 + d + .05);
    });
  } catch (e) {}
}

/* ---------------- 自动日志保存（连接后自动记录；可选目录；超限轮转防卡死） ---------------- */
const AutoLog = {
  on: false,
  dir: null,          // FileSystemDirectoryHandle（用户选择）
  mode: 'none',       // 'file' | 'download'
  base: '', seg: 0, fh: null, writer: null,
  buf: [], bufBytes: 0, _downloadBuf: '',
  limit: 2 * 1024 * 1024,  // 每段 2MB，达到自动轮转新文件
  timer: null, rotBusy: false,
  sanitize(name) { return String(name || 'serial').replace(/[\\/:*?"<>|]/g, '_').slice(0, 40); },
  async pickDir() {
    try {
      if (!window.showDirectoryPicker) throw new Error('当前浏览器不支持选择目录（将保存到下载目录）');
      const dir = await window.showDirectoryPicker();
      this.dir = dir;
      toast('自动保存目录已设置', 'ok');
    } catch (e) {
      if (e.name === 'AbortError') return;
      this.dir = null;
      toast('无法选择目录（将保存到浏览器下载目录）：' + e.message, 'warn');
    }
    this.updateStatus();
  },
  start(portName) {
    if (!this.on) return;
    const ts = fmtFileTime();
    this.base = this.sanitize(portName) + '_' + ts;
    this.seg = 0; this.buf = []; this.bufBytes = 0; this._downloadBuf = '';
    this.mode = this.dir ? 'file' : 'download';
    const head = [
      '# Serial Listener 自动日志',
      '# 端口: ' + (portName || '-') + '  参数: ' + S.baud + ' ' + S.dataBits + 'N' + (S.stopBits === 2 ? '2' : '1') + '  编码: ' + S.encoding,
      '# 开始: ' + new Date().toLocaleString('zh-CN') + '  模式: ' + (this.mode === 'file' ? '指定目录' : '浏览器下载目录'),
      '# TX 行以 → 标记',
      '#'
    ].join('\r\n') + '\r\n';
    this.buf.push(head); this.bufBytes += head.length;
    this.openSegment().catch((e) => toast('自动日志创建失败：' + e.message, 'err'));
    this.timer = setInterval(() => this.flush(), 2000);
    this.updateStatus();
  },
  async openSegment() {
    if (this.mode !== 'file' || !this.dir) { this.writer = null; return; }
    this.fh = await this.dir.getFileHandle(this._fname(), { create: true });
    this.writer = await this.fh.createWritable();
  },
  _fname() { return this.base + (this.seg > 0 ? '_' + pad(this.seg, 3) : '') + '.log'; },
  _line(e) {
    const body = (S.mode === 'hex' || e.kind === 'hex') ? e.hex : e.ascii;
    // 每条记录必须以换行结尾，否则多行数据会首尾相连（日志无法阅读）
    return e.t + '  ' + (e.kind === 'tx' ? '→ ' : '') + body + '\r\n';
  },
  push(e) {
    if (!this.on || this.mode === 'none') return;
    const line = this._line(e);
    this.buf.push(line); this.bufBytes += line.length;
    if (this.bufBytes >= this.limit) this.scheduleRotate();
  },
  scheduleRotate() {
    if (this.rotBusy) return;
    this.rotBusy = true;
    setTimeout(async () => {
      try { await this.rotate(); } finally { this.rotBusy = false; }
    }, 0);
  },
  async rotate() {
    if (this.mode === 'none') return;
    await this.flush();
    if (this.mode === 'file' && this.writer) { try { await this.writer.close(); } catch (e) {} this.writer = null; }
    else this.downloadSegment();
    this.seg++;
    this.buf = []; this.bufBytes = 0;
    try { await this.openSegment(); } catch (e) { toast('自动日志轮转失败：' + e.message, 'err'); }
    this.updateStatus();
  },
  async flush() {
    if (!this.buf.length) return;
    const text = this.buf.join('');
    if (this.mode === 'file') {
      if (!this.writer) return; // writer 未就绪（轮转空窗期）：保留缓存，下次 flush 重试，避免丢数据
      try {
        await this.writer.write(text);
        this.buf = []; this.bufBytes = 0;
      } catch (e) { toast('自动日志写入失败：' + e.message, 'err'); }
    } else if (this.mode === 'download') {
      this._downloadBuf += text; // 下载模式：按段保存，段满/停止时下载
      this.buf = []; this.bufBytes = 0;
    }
  },
  downloadSegment() {
    if (!this._downloadBuf) return;
    const blob = new Blob([this._downloadBuf], { type: 'text/plain;charset=utf-8' });
    this._downloadBuf = '';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = this._fname();
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  },
  async stop() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (this.mode === 'none') { this.updateStatus(); return; }
    try {
      await this.flush();
      if (this.mode === 'file' && this.writer) { try { await this.writer.close(); } catch (e) {} this.writer = null; }
      else if (this.mode === 'download') this.downloadSegment();
    } catch (e) {}
    this.mode = 'none'; this.seg = 0; this.base = ''; this.buf = []; this.bufBytes = 0;
    this.updateStatus();
  },
  updateStatus() {
    const el = $('#st-autolog');
    if (!el) return;
    if (!this.on) { el.textContent = ''; el.className = 'st-autolog'; return; }
    if (this.mode === 'file') { el.textContent = '保存中: ' + this._fname(); el.className = 'st-autolog on'; }
    else if (this.mode === 'download') { el.textContent = '保存中: 下载目录'; el.className = 'st-autolog dl'; }
    else { el.textContent = '待连接'; el.className = 'st-autolog'; }
  }
};

/* ---------------- 发送 ---------------- */
function parseHexInput(s) {
  const clean = s.replace(/[\s,，]+/g, '');
  if (!clean) return null;
  if (!/^[0-9a-fA-F]+$/.test(clean)) throw new Error('HEX 内容含非法字符');
  if (clean.length % 2 !== 0) throw new Error('HEX 长度必须为偶数（每字节 2 位）');
  const out = new Uint8Array(clean.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(clean.substr(i * 2, 2), 16);
  return out;
}
async function doSend() {
  const raw = $('#in-send').value;
  if (!raw) return;
  // 记录命令历史（去重相邻重复）
  if (!state.cmdHist.length || state.cmdHist[state.cmdHist.length - 1] !== raw) {
    state.cmdHist.push(raw);
    if (state.cmdHist.length > 50) state.cmdHist.shift();
  }
  state.cmdIdx = -1;
  Store.save(); // 持久化命令历史
  let bytes;
  try {
    if (S.sendMode === 'hex') {
      bytes = parseHexInput(raw);
      if (!bytes) return;
    } else {
      const CRLF_MAP = { 'none': '', 'CR': '\r', 'LF': '\n', 'CRLF': '\r\n' };
      const crlf = CRLF_MAP[S.crlf] || '';
      bytes = new TextEncoder().encode(raw + crlf);
    }
  } catch (e) { toast(e.message, 'err'); return; }
  const ok = await Serial.send(bytes);
  if (ok) {
    viewAddTx(raw, bytes);
    toast('已发送 ' + bytes.length + ' 字节', 'ok', 1500);
  }
}
function histPrev() {
  if (!state.cmdHist.length) return;
  state.cmdIdx = state.cmdIdx < 0 ? state.cmdHist.length - 1 : Math.max(0, state.cmdIdx - 1);
  $('#in-send').value = state.cmdHist[state.cmdIdx];
}
function histNext() {
  if (state.cmdIdx < 0) return;
  state.cmdIdx++;
  if (state.cmdIdx >= state.cmdHist.length) { state.cmdIdx = -1; $('#in-send').value = ''; }
  else $('#in-send').value = state.cmdHist[state.cmdIdx];
}
function renderQuickSends() {
  const q = $('#quicklist');
  q.innerHTML = '';
  S.quickSends.forEach((item, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.title = '点击发送';
    const txt = document.createElement('span');
    txt.textContent = item.length > 24 ? item.slice(0, 24) + '…' : item;
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '×'; x.title = '删除';
    x.addEventListener('click', (ev) => { ev.stopPropagation(); S.quickSends.splice(i, 1); Store.save(); renderQuickSends(); });
    chip.appendChild(txt); chip.appendChild(x);
    chip.addEventListener('click', () => { $('#in-send').value = item; doSend(); });
    q.appendChild(chip);
  });
}

async function onConnectClick() {
  if (state.busy) return;
  // 入口即置忙：防止快速双击建立双连接/双读循环（竞态）
  state.busy = true;
  updateConnectBtn();
  try {
    if (state.connected) { await Serial.disconnect(false); return; }
    const opts = Serial.getOpts();
    let port = null;
    // 下拉框选中的端口优先（可切换多个已授权端口）
    const sel = $('#sel-port');
    const ports = state.grantedPorts || [];
    if (sel.value !== '' && ports.length) port = ports[Number(sel.value)];
    if (!port) port = state.lastPort;
    if (!port) {
      toast('请先在系统对话框中选择串口', 'warn');
      port = await Serial.pickPort();
      if (!port) return;
    }
    await Serial.connect(port, opts);
  } finally {
    state.busy = false;
    updateConnectBtn();
  }
}
function maybeApplyParams(label) {
  if (state.connected && state.lastPort) {
    toast(label + '已修改，正在重新打开端口…', 'info');
    (async () => {
      await Serial.disconnect(true);
      await Serial.connect(state.lastPort, Serial.getOpts());
    })();
  }
}

/* ---------------- 初始化 ---------------- */
async function init() {
  populateBaud();
  applySettingsToUI();
  bindUI();
  tickClock();
  setInterval(tickClock, 1000);
  state.cmdHist = S.cmdHist || [];
  // RX 速率统计（每秒）
  setInterval(() => {
    const cur = state.rx;
    $('#st-rate').textContent = fmtBytes(cur - lastRx) + '/s';
    lastRx = cur;
  }, 1000);
  if (!navigator.serial) {
    const bar = document.createElement('div');
    bar.className = 'unsupported';
    bar.textContent = '⚠ 当前浏览器不支持 Web Serial API，请使用 Chrome 或 Edge 打开本文件';
    document.body.prepend(bar);
    return;
  }
  await Serial.refreshPorts(S.lastPortName);
  if (TEST_MODE) {
    // 供自动化测试使用的钩子
    window.__test = {
      feed(bytes) {
        const port = state.port || (fakeSerial._ports[0]);
        if (!port) throw new Error('no fake port');
        if (port._ctrl) port.feed(bytes instanceof Uint8Array ? bytes : new TextEncoder().encode(String(bytes)));
      },
      feedBytes(arr) { const p = state.port || fakeSerial._ports[0]; if (p) p.feed(new Uint8Array(arr)); },
      txBytes() { const p = state.port || fakeSerial._ports[0]; return p ? p.txAll().total : 0; },
      txAll() { const p = state.port || fakeSerial._ports[0]; return p ? p.txAll() : { bytes: [], total: 0 }; },
      drop() { const p = state.port || fakeSerial._ports[0]; if (p) p.drop(); },
      cancelNextPick() { fakeSerial._cancelNext = true; },
      clearLastPort() { state.lastPort = null; state.lastPortName = ''; },
      clearHist() { state.cmdHist.length = 0; S.cmdHist = state.cmdHist; },
      setAutoLogLimit(n) { AutoLog.limit = n; },
      clearAutoLogDir() { AutoLog.dir = null; },
      autoLogState() { return { on: AutoLog.on, mode: AutoLog.mode, base: AutoLog.base, seg: AutoLog.seg, bufBytes: AutoLog.bufBytes }; },
      autoLogFiles() { return window.__autoLogFiles || {}; },
      installFakeDir() {
        window.__autoLogFiles = {};
        window.showDirectoryPicker = async () => ({
          getFileHandle: async (name) => ({
            name,
            createWritable: async () => ({
              write: (text) => { window.__autoLogFiles[name] = (window.__autoLogFiles[name] || '') + String(text); },
              close: async () => {}
            })
          })
        });
        return true;
      },
      failNextOpen(msg) { const p = state.port || fakeSerial._ports[0]; if (p) p._failOpen = msg || '模拟打开失败'; },
      failNextWrite(msg) { const p = state.port || fakeSerial._ports[0]; if (p) p._failWrite = msg || '模拟写入失败'; },
      setPorts(names) {
        fakeSerial._ports = names.map((n, i) => new FakePortClass(n, i + 1));
        try { sessionStorage.setItem('__testPorts', names.join(',')); } catch (e) {}
        if (state.grantedPorts) state.grantedPorts = fakeSerial._ports;
        return Serial.refreshPorts();
      },
      connect() { return onConnectClick(); },
      disconnect() { return Serial.disconnect(false); },
      settings() { return S; },
      state() { return state; },
      viewerLines() { return $('#viewer').children.length; },
      rebuildMs() { const t0 = performance.now(); rebuildView(); return performance.now() - t0; },
      viewerText() { return $('#viewer').textContent; },
      log() { return state.log; }
    };
    console.log('[test] fake serial ready');
  }
}
init();
</script>
</body>
</html>
